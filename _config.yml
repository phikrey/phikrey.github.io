external:                       # accepts {file, title, url, icon, sidebaricon}
  - {title: Mail, icon: envelope, url: "mailto:philipp.kreyenmeier@gmail.com"}
  - {title: Github, icon: github, url: "https://github.com/phikrey"}
  - {title: Google Scholar, icon: google scholar, url: "https://scholar.google.com/citations?user=7UYwkkEAAAAJ&hl=de"}

